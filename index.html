<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרשמה לאסיפת הורים</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --occupied: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { max-width: 640px; width: 100%; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px 24px; border: 1px solid var(--border); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; text-align: center; color: #0f172a; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; transition: border 0.2s; }
    input:focus { outline: none; border-color: var(--primary); }

    .slots-title { font-weight: 600; font-size: 0.95rem; margin: 24px 0 12px; }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .slot-btn { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 500; text-align: center; transition: all 0.2s; }
    .slot-btn:hover:not(.occupied):not(.selected) { border-color: var(--primary); background: #eff6ff; }
    .slot-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
    .slot-btn.occupied { background: var(--occupied); color: #94a3b8; border-color: transparent; cursor: not-allowed; text-decoration: line-through; }

    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .success-card { display: none; text-align: center; padding: 20px 0; }
    .success-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .success-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; color: #16a34a; }
    .calendar-btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #0f172a; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div id="booking-section">
      <h1>אסיפת הורים</h1>
      <p class="subtitle">אנא בחרו שעה נוחה ומלאו את הפרטים לקביעת פגישה</p>

      <form id="appointment-form">
        <div class="form-group">
          <label for="parentName">שם ההורה</label>
          <input type="text" id="parentName" required placeholder="לדוגמה: ישראל ישראלי">
        </div>

        <div class="form-group">
          <label for="studentName">שם התלמיד/ה</label>
          <input type="text" id="studentName" required placeholder="לדוגמה: דני ישראלי">
        </div>

        <div class="form-group">
          <label for="parentPhone">טלפון ליצירת קשר</label>
          <input type="tel" id="parentPhone" required placeholder="050-0000000">
        </div>

        <div class="form-group">
          <label for="parentEmail">אימייל (לקבלת תזכורת)</label>
          <input type="email" id="parentEmail" required placeholder="name@example.com">
        </div>

        <div class="slots-title">בחירת משבצת זמן:</div>
        <div class="slots-grid" id="slots-container">טוען שעות פנויות...</div>

        <button type="submit" class="btn-submit" id="submitBtn" disabled>אישור וקביעת פגישה</button>
      </form>
    </div>

    <div class="success-card" id="success-section">
      <div class="success-icon">✅</div>
      <div class="success-title">הפגישה נקבעה בהצלחה!</div>
      <p id="success-details" style="color: var(--text-muted); line-height: 1.6;"></p>
      
      <a href="#" id="gcal-link" target="_blank" class="calendar-btn">
        📅 הוספה ל-Google Calendar
      </a>
    </div>
  </div>

  <script>
    // הגדרות הפרויקט המלאות
    const firebaseConfig = {
      apiKey: "AIzaSyDHVI9ePlENeGIkL_9JqTJOnlSefgF0Shg",
      authDomain: "zimoon-torim.firebaseapp.com",
      databaseURL: "https://zimoon-torim-default-rtdb.firebaseio.com",
      projectId: "zimoon-torim",
      storageBucket: "zimoon-torim.firebasestorage.app",
      messagingSenderId: "850362438648",
      appId: "1:850362438648:web:b253a467076cf4752b3c0d",
      measurementId: "G-YTDE6GYESQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const appointmentsRef = db.ref('appointments');

    // שעות לבחירה (ניתן להתאים את הרשימה לשעות הרצויות)
    const timeSlots = [
      "16:00", "16:15", "16:30", "16:45",
      "17:00", "17:15", "17:30", "17:45",
      "18:00", "18:15", "18:30", "18:45",
      "19:00", "19:15", "19:30", "19:45"
    ];

    let selectedSlot = null;
    let bookedSlots = {};

    const slotsContainer = document.getElementById('slots-container');
    const submitBtn = document.getElementById('submitBtn');

    // האזנה בזמן אמת לשינויים
    appointmentsRef.on('value', (snapshot) => {
      bookedSlots = snapshot.val() || {};
      renderSlots();
    });

    function renderSlots() {
      slotsContainer.innerHTML = '';
      timeSlots.forEach(time => {
        const slotKey = time.replace(':', '_');
        const isBooked = !!bookedSlots[slotKey];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `slot-btn ${isBooked ? 'occupied' : ''} ${selectedSlot === time ? 'selected' : ''}`;
        btn.innerText = time;
        
        if (isBooked) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            selectedSlot = time;
            renderSlots();
            submitBtn.disabled = false;
          };
        }
        slotsContainer.appendChild(btn);
      });
    }

    // שליחת הטופס עם מניעת כפילות
    document.getElementById('appointment-form').onsubmit = async (e) => {
      e.preventDefault();
      if (!selectedSlot) return;

      const parentName = document.getElementById('parentName').value;
      const studentName = document.getElementById('studentName').value;
      const parentPhone = document.getElementById('parentPhone').value;
      const parentEmail = document.getElementById('parentEmail').value;
      const slotKey = selectedSlot.replace(':', '_');

      submitBtn.disabled = true;
      submitBtn.innerText = "שומר...";

      const slotRef = appointmentsRef.child(slotKey);
      slotRef.transaction((currentData) => {
        if (currentData === null) {
          return {
            parentName,
            studentName,
            parentPhone,
            parentEmail,
            time: selectedSlot,
            createdAt: new Date().toISOString()
          };
        } else {
          return; // תפוס
        }
      }, (error, committed) => {
        if (error || !committed) {
          alert('המשבצת נתפסה זה עתה על ידי הורה אחר. אנא בחרו שעה פנויה.');
          selectedSlot = null;
          submitBtn.innerText = "אישור וקביעת פגישה";
          renderSlots();
        } else {
          showConfirmation(parentName, studentName, selectedSlot);
        }
      });
    };

    function showConfirmation(parent, student, time) {
      document.getElementById('booking-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';

      document.getElementById('success-details').innerHTML = `
        נקבעה פגישה עבור <strong>${student}</strong> (${parent})<br>
        בשעה <strong>${time}</strong>
      `;

      // יצירת קישור ליומן גוגל
      const startTime = time.replace(':', '') + '00';
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=אסיפת+הורים+-+${encodeURIComponent(student)}&dates=${dateStr}T${startTime}/${dateStr}T${startTime}&details=פגישת+אסיפת+הורים+עבור+${encodeURIComponent(student)}+עם+${encodeURIComponent(parent)}`;
      
      document.getElementById('gcal-link').href = gcalUrl;
    }
  </script>
</body>
</html>
